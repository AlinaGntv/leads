<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лиды</title>
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="defaultMonthLabel">Месяц</p>
          <h1>Лиды</h1>
        </div>
        <button class="ghost-button" id="resetTodayButton" type="button">Сбросить день</button>
      </header>

      <div class="panel month-nav" aria-label="Навигация по месяцам">
        <button class="icon-button" id="prevMonthButton" type="button" aria-label="Предыдущий месяц">‹</button>
        <div class="month-nav-center">
          <input type="month" id="monthPicker" aria-label="Выбрать месяц" />
        </div>
        <button class="icon-button" id="nextMonthButton" type="button" aria-label="Следующий месяц">›</button>
      </div>

      <div class="panel day-nav" aria-label="Навигация по дате">
        <button class="icon-button" id="prevDayButton" type="button" aria-label="Предыдущий день">‹</button>
        <div class="day-nav-center">
          <input type="date" id="datePicker" aria-label="Выбрать дату" />
          <button class="ghost-button is-hidden" id="goTodayButton" type="button">Сегодня</button>
        </div>
        <button class="icon-button" id="nextDayButton" type="button" aria-label="Следующий день">›</button>
      </div>

      <section class="hero" aria-label="Прогресс за день">
        <div class="hero-copy">
          <p class="label" id="heroDayLabel">Сегодня</p>
          <div class="big-number">
            <span id="todayCount">0</span><span class="suffix">/45</span>
          </div>
          <span class="extra-chip is-hidden" id="todayExtraChip">+0 сверх нормы</span>
        </div>
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="50"></circle>
            <circle class="ring-fill" id="todayRing" cx="60" cy="60" r="50"></circle>
          </svg>
          <span id="todayPercent">0%</span>
        </div>
      </section>

      <section class="stats" aria-label="Статистика месяца">
        <article>
          <span class="stat-value" id="monthCount">0</span>
          <span class="stat-label">за месяц</span>
        </article>
        <article>
          <span class="stat-value" id="monthLeft">1000</span>
          <span class="stat-label">осталось</span>
        </article>
        <article>
          <span class="stat-value" id="weekdayAverage">0</span>
          <span class="stat-label">в среднем</span>
        </article>
      </section>

      <section class="panel" aria-label="Кружочки за сегодня">
        <div class="section-title">
          <h2>45 касаний</h2>
          <button class="icon-button" id="fillTodayButton" type="button" aria-label="Закрыть цель дня" title="Закрыть цель дня">45</button>
        </div>
        <div class="extra-row">
          <span class="extra-label">Касания сверх нормы</span>
          <div class="funnel-controls">
            <button class="funnel-button" type="button" id="extraMinus" aria-label="Минус касание сверх нормы">−</button>
            <span class="funnel-value" id="extraCount">0</span>
            <button class="funnel-button" type="button" id="extraPlus" aria-label="Плюс касание сверх нормы">+</button>
          </div>
        </div>
        <div class="daily-grid" id="dailyGrid"></div>
      </section>

      <section class="panel" aria-label="Карта месяца">
        <div class="section-title">
          <h2>1000 за месяц</h2>
          <button class="ghost-button" id="resetMonthButton" type="button">Новый месяц</button>
        </div>
        <div class="month-progress">
          <div id="monthProgressBar"></div>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </section>

      <section class="panel" aria-label="Воронка конверсий">
        <div class="section-title">
          <h2>Воронка</h2>
          <span class="funnel-chip" id="funnelFromTouches">Касание → работа: 0%</span>
        </div>
        <div class="funnel-modes" aria-label="Период воронки">
          <button class="mode-chip" id="funnelModeDay" type="button">День</button>
          <button class="mode-chip" id="funnelModeMonth" type="button">Месяц</button>
        </div>
        <div class="funnel">
          <article class="funnel-step">
            <div class="funnel-head">
              <span class="funnel-label">Касания</span>
              <span class="funnel-value" id="funnelTouchesValue">0</span>
            </div>
            <div class="funnel-track">
              <div class="funnel-fill is-touches" id="funnelTouchesFill"></div>
            </div>
            <p class="funnel-meta" id="funnelTouchesMeta"></p>
          </article>

          <article class="funnel-step">
            <div class="funnel-head">
              <span class="funnel-label">Ответили</span>
              <div class="funnel-controls">
                <button class="funnel-button" type="button" data-key="replies" data-delta="-1" aria-label="Минус один ответ">−</button>
                <span class="funnel-value" id="funnelRepliesValue">0</span>
                <button class="funnel-button" type="button" data-key="replies" data-delta="1" aria-label="Плюс один ответ">+</button>
              </div>
            </div>
            <div class="funnel-track">
              <div class="funnel-fill is-replies" id="funnelRepliesFill"></div>
              <span class="funnel-pct" id="funnelRepliesPct">0%</span>
            </div>
            <p class="funnel-meta" id="funnelRepliesMeta"></p>
          </article>

          <article class="funnel-step">
            <div class="funnel-head">
              <span class="funnel-label">Тестовые</span>
              <div class="funnel-controls">
                <button class="funnel-button" type="button" data-key="tests" data-delta="-1" aria-label="Минус одна тестовая">−</button>
                <span class="funnel-value" id="funnelTestsValue">0</span>
                <button class="funnel-button" type="button" data-key="tests" data-delta="1" aria-label="Плюс одна тестовая">+</button>
              </div>
            </div>
            <div class="funnel-track">
              <div class="funnel-fill is-tests" id="funnelTestsFill"></div>
              <span class="funnel-pct" id="funnelTestsPct">0%</span>
            </div>
            <p class="funnel-meta" id="funnelTestsMeta"></p>
          </article>

          <article class="funnel-step">
            <div class="funnel-head">
              <span class="funnel-label">Работа</span>
              <div class="funnel-controls">
                <button class="funnel-button" type="button" data-key="works" data-delta="-1" aria-label="Минус одна работа">−</button>
                <span class="funnel-value" id="funnelWorksValue">0</span>
                <button class="funnel-button" type="button" data-key="works" data-delta="1" aria-label="Плюс одна работа">+</button>
              </div>
            </div>
            <div class="funnel-track">
              <div class="funnel-fill is-works" id="funnelWorksFill"></div>
              <span class="funnel-pct" id="funnelWorksPct">0%</span>
            </div>
            <p class="funnel-meta" id="funnelWorksMeta"></p>
          </article>
        </div>
      </section>

      <section class="panel" aria-label="Лог по дням">
        <div class="section-title">
          <h2>Лог по дням</h2>
        </div>
        <div class="log-table">
          <div class="log-row log-head">
            <span>Дата</span>
            <span>Касания</span>
            <span>Ответы</span>
            <span>Тестовые</span>
            <span>Работа</span>
          </div>
          <div id="logBody"></div>
          <div class="log-row log-total" id="logTotals"></div>
        </div>
      </section>
    </main>

    <script src="script.js?v=13"></script>
  </body>
</html>
